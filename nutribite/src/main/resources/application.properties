server.port=8080
spring.application.name=NutriBite

spring.profiles.active=dev

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/NutriBite
spring.datasource.username=postgres
spring.datasource.password=977803
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=NutriBiteSuperSecretKeyForJWTGenerationChangeThisInProduction123456789
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Snap AI
snap.enabled=false