server.port=8080

spring.application.name=NutriBite
spring.profiles.active=dev

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/NutriBite
spring.datasource.username=postgres
spring.datasource.password=977803
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=NutriBiteSuperSecretKeyForJWTGenerationChangeThisInProduction123456789
jwt.expiration=86400000
